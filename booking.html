<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Details | Next Level Gaming</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="site-header" class="site-header"></header><main><h1>Your Details</h1><div class="booking-layout"><section class="summary-panel"><h2>Your Quote</h2><div id="bookingRecap"></div></section><section class="form-panel"><h2>Contact Information</h2><form id="bookingForm" novalidate><label for="fullName">Full Name</label><input id="fullName" type="text"><div class="error" id="fullNameError"></div><label for="cellNumber">Cell Number</label><input id="cellNumber" type="tel"><div class="error" id="cellNumberError"></div><label for="emailAddress">Email Address</label><input id="emailAddress" type="email"><div class="error" id="emailAddressError"></div><button class="button" type="submit">Submit Request</button><div class="request-progress" id="requestProgress" hidden><p>Processing</p><div class="request-progress-track" role="progressbar" aria-label="Processing request" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="request-progress-fill" id="requestProgressFill"></div></div><strong id="requestProgressValue">0%</strong></div></form></section></div></main><footer id="site-footer"></footer><script src="js/nav.js"></script><script src="js/data.js"></script><script src="js/render.js"></script><script src="js/validate.js"></script><script>
var quote = JSON.parse(sessionStorage.getItem("quoteBreakdown") || "null");
if (!quote || !quote.items.length) document.getElementById("bookingRecap").innerHTML = '<p class="notice">Please pick items first on the <a href="packages.html">packages page</a>.</p>';
else { var rows = quote.items.map(function (slug) { var item = catalogItems.find(function (entry) { return entry.slug === slug; }); return '<tr><td>' + item.name + '</td><td>' + currency(item.price) + '</td></tr>'; }).join(""); document.getElementById("bookingRecap").innerHTML = '<table><thead><tr><th>Item</th><th>Price</th></tr></thead><tbody>' + rows + '</tbody></table><p>Subtotal: ' + currency(quote.subtotal) + '</p><p>Discount: ' + currency(quote.discount || 0) + '</p><p>VAT (15%): ' + currency(quote.vat) + '</p><strong>Total: ' + currency(quote.total) + '</strong>'; }
document.addEventListener("DOMContentLoaded", function () { document.getElementById("requestProgress").hidden = true; setupValidation("bookingForm", false); });
</script></body></html>
