<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirmation | Next Level Gaming</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="site-header" class="site-header"></header><main><section class="confirmation"><div class="confirmation-image image-slot" id="confirmationImage"></div><h1>Thank You</h1><p id="purchaseMessage">Thank you for your purchase.</p><p>Your request has been received, a consultant will contact you shortly.</p><p>Amount Due</p><div class="amount" id="amountDue"></div><p>Please be ready to pay this amount when you arrive.</p><p class="redirect-message">Redirecting to the home page in <strong id="redirectCountdown">5</strong> seconds.</p><button class="button" id="backHome">Back to Home</button></section></main><footer id="site-footer"></footer><script src="js/nav.js"></script><script src="js/render.js"></script><script>setImage(document.getElementById("confirmationImage"), "assets/confirmation.jpg", "Request confirmed"); var quote = JSON.parse(sessionStorage.getItem("quoteBreakdown") || "null"); document.getElementById("amountDue").textContent = quote ? currency(quote.total) : "R0.00";
var purchasedNames = quote && quote.items ? quote.items.map(function (slug) { var item = catalogItems.find(function (entry) { return entry.slug === slug; }); return item ? item.name : ""; }).filter(Boolean) : [];
if (purchasedNames.length) document.getElementById("purchaseMessage").textContent = "Thank you for purchasing " + purchasedNames.join(", ") + ".";
var countdown = 5;
var countdownTimer = setInterval(function () {
  countdown -= 1;
  document.getElementById("redirectCountdown").textContent = countdown;
  if (countdown === 0) {
    clearInterval(countdownTimer);
    goHome();
  }
}, 1000);
function goHome() { sessionStorage.removeItem("quoteBreakdown"); sessionStorage.removeItem("quoteItems"); sessionStorage.removeItem("customerDetails"); window.location.href = "index.html"; }
document.getElementById("backHome").onclick = goHome;</script></body></html>
